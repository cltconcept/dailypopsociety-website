# Reprend le gabarit xenia/dentalexpert avec deux corrections : un seul Cache-Control
# par réponse, no-cache sur toutes les pages HTML ; en-têtes de sécurité ajoutés.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # En-têtes de sécurité de base (pas de CSP pour l'instant). add_header dans une
  # location annule ceux hérités du bloc server dès que cette location en définit
  # elle-même (cas de toutes les locations ci-dessous) : on les répète donc partout.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Les assets d'Astro portent un hash dans leur nom : immuables.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
  # Médias : longue durée, mais révocable (les noms ne sont pas hashés).
  location /media/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
  # Le HTML doit toujours être revalidé. Couvre aussi les dossiers servis via
  # l'index interne (ex. /la-carte/ -> redirection interne vers /la-carte/index.html,
  # qui rematche cette location) et la page 404.
  location ~ \.html$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
  # Site multi-pages : une URL inconnue répond 404, pas de fallback SPA (soft-404).
  error_page 404 /404.html;
  location / {
    try_files $uri $uri/ =404;
  }
}
